meta:
  name: cotraining_env_diversity
  source: "Dual-team simultaneous self-play with topology diversity"
  added: 2026-09-06
  notes: |
    Topology-diversity counterpart to cotraining. Both parameter-sharing
    policies start from fresh weights and train on a fixed bank of 100
    generated topologies. Other recipe-controlled environment-diversity axes
    remain disabled. Evaluation uses the same held-out bank as cotraining.

algorithm: ippo

# Evaluate frozen learned-vs-learned checkpoints every 100k steps and attach
# both trainable teams' curves to the active local MLflow run.
mlflow:
  checkpoint_eval:
    every_steps: 100000
    episodes_per_seed: 10
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  total_timesteps: 10000000
  variant: cc4_stock

  # The first five seeds are exactly the baseline cotraining pool; seeds 5
  # through 99 add topology diversity while every other configured dimension
  # remains unchanged. The shared cache avoids regenerating the common subset.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 100
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  # Keep this declaration identical to cotraining so both experiments are
  # compared on the exact same 100 held-out snapshots (seeds 100 through 199).
  topology_generation:
    generator: jax
    seed_start: 100
    count: 100
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # At the end of training, compare every adjacent durable checkpoint in both
  # directions: current Blue vs prior Red and current Red vs prior Blue.
  play_priors:
    enabled: true
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false

  # Match cotraining's ordered final-checkpoint evaluation pipeline.
  after_training:
    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null  # eval_matchup accepts separate Blue/Red model flags.
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1

jax:
  num_envs: 48
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 40  # 10 durable checkpoints over this 10M-step run.
