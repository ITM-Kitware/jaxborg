meta:
  name: cotraining
  source: "Dual-team simultaneous self-play baseline"
  added: 2026-08-16
  notes: |
    Opt-in Blue/Red co-training recipe. Both parameter-sharing policies start
    from fresh weights, act on the same pre-step state, and learn from the same
    game payoff (with the Red objective equal to the negative Blue score).

algorithm: ippo

# Evaluate frozen learned-vs-learned checkpoints every 100k steps and attach
# both trainable teams' curves to the active local MLflow run.
mlflow:
  checkpoint_eval:
    every_steps: 100000
    episodes: 10
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  total_timesteps: 10000000
  variant: cc4_stock

eval:
  variant: cc4_stock

  # After the durable final bundle and sidecar are written, extract the Blue
  # policy from that exact two-policy bundle and evaluate it in CybORG against
  # the stock FSM plus each CIA-biased scripted Red. The same paired seeds are
  # reused for every opponent. Increase to 1000-1099 for a 100-episode study.
  scripted_red:
    after_training: true
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false
    workers: 1

jax:
  num_envs: 48
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 0  # Keep only the final model; MLflow eval files are transient.

cleanrl:
  num_envs: 48
  rollout_length: 500
  num_rollouts_per_update: 1
  num_minibatches: 16
  num_epochs: 4
  checkpoint_every_updates: 0  # Keep only the final local model.
