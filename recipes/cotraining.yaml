meta:
  name: cotraining
  source: "Dual-team simultaneous self-play baseline"
  added: 2026-08-16
  notes: |
    Opt-in Blue/Red co-training recipe. Both parameter-sharing policies start
    from fresh weights, act on the same pre-step state, and learn from the same
    game payoff (with the Red objective equal to the negative Blue score).

algorithm: ippo

# Evaluate frozen learned-vs-learned checkpoints every 100k steps and attach
# both trainable teams' curves to the active local MLflow run.
mlflow:
  checkpoint_eval:
    every_steps: 100000
    episodes_per_seed: 10
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  total_timesteps: 10000000
  variant: cc4_stock

  # Restrict resets to five immutable samples from the same pure-JAX
  # generator used by unbanked co-training. jax.num_envs controls rollout
  # parallelism; this count controls the number of distinct train topologies.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 5
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  # Evaluate every requested dynamics seed on the same 100 held-out topology
  # snapshots used by cotraining_env_diversity (seeds 100 through 199).
  topology_generation:
    generator: jax
    seed_start: 100
    count: 100
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # At the end of training, compare every adjacent durable checkpoint in both
  # directions: current Blue vs prior Red and current Red vs prior Blue.
  play_priors:
    enabled: true
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false

  # Run two named evaluations, in order, after the durable final bundle and
  # sidecar are written. The learned matchup selects both policies from the
  # exact co-trained bundle. The scripted sweep then selects its trained Blue
  # policy and evaluates it against FSM and CIA Red agents in the same JAX
  # topology bank with fixed per-topology role assignments.
  after_training:
    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null  # eval_matchup accepts separate Blue/Red model flags.
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1

jax:
  num_envs: 48
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 40  # 10 durable checkpoints over this 10M-step run.
