# Tiny ownership/lineage smoke, separate from scientific experiment recipes.
meta:
  name: logging_smoke
  source: issue-25 reproducibility verification only
algorithm: ippo
core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  norm_rewards: false
arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh
train:
  episode_length: 500
  buffer_size: 4
  minibatch_size: 4
  total_timesteps: 1000
  variant: cc4_stock
eval:
  variant: cc4_stock
jax:
  num_envs: 1
  num_minibatches: 1
  update_epochs: 1
  checkpoint_every_updates: 1
cleanrl:
  num_envs: 1
  rollout_length: 4
  num_rollouts_per_update: 1
  num_minibatches: 1
  num_epochs: 1
  checkpoint_every_updates: 1
