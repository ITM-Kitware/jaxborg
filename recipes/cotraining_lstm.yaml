meta:
  name: cotraining_lstm
  source: "LSTM twin of cotraining_rnn"
  added: 2026-09-09
  notes: |
    `cotraining_rnn` with one edit: `cell: lstm` instead of `cell: gru`. Every
    other field is identical by construction -- a test in
    tests/test_recipes_smoke.py holds the two files that way -- so a
    difference between the two runs is a difference between the cells and
    nothing else. `cotraining` and `cotraining_test_rule_change` stay feedforward.

    Run `cotraining_rnn` first. GRU is what JaxMARL's recurrent IPPO baseline
    uses, so its behaviour is comparable to published recurrent-IPPO results;
    it is ~130k parameters lighter per policy; and the horizon Blue needs is
    short: the
    Analyse -> Remove gap is 5-20 steps, and the longer-lived block/phase
    state is directly observable rather than something the cell has to latch.
    An LSTM's structural advantage is its additive cell-state path, which
    holds a value unchanged over hundreds of steps where a GRU's convex-blend
    update decays it; that pays off past the horizon this game asks for.

    Cost is NOT a reason to prefer GRU here. Measured on the real update shape
    (T=500, 48 envs x 5 agents, 4 epochs), this arm is ~25% FASTER per PPO
    update than `cotraining_rnn`: flax's `nn.OptimizedLSTMCell` fuses its gate
    matmuls, and `nn.GRUCell` has no optimized variant. The extra parameters
    are real; the extra time is not.

    So this arm earns its seeds when the GRU run has the right *shape* but
    stalls -- `reward_asf` improving and Analyse/Remove sequencing tightening,
    while Blue still drifts. That says the retention hypothesis is the right
    family and the horizon is the limit. The cheaper next axis is
    `trunk: separate`: Blue's value term runs ~8x its actor term, and a shared
    trunk lets that gradient rewrite the features the policy reads.

    Rule knobs are deliberately left at stock CC4 so this arm is comparable
    to `cotraining_test_rule_change`'s control arm and to the 40M `cotraining` runs.
    To stack the architecture change on top of a rule change, copy
    `train.variant_overrides` across from `cotraining_test_rule_change`.

    Both teams are recurrent here. Red has the 706-dim view of all 137 hosts
    and 0.97 explained variance, so it stands to gain at least as much from
    memory as Blue does -- and under a zero-sum payoff a symmetric capacity
    increase can leave Blue flat. To isolate Blue, hold Red feedforward:

      train:
        team_overrides:
          red: {arch: {name: shared, hidden_dim: 256, hidden_layers: 2, activation: tanh}}

    An override that changes `arch.name` *replaces* the arch block rather than
    merging into it, so Red does not inherit `cell`/`trunk` (which the
    feedforward archs reject) or the recurrent `hidden_layers: 1`. An override
    that keeps the same name still merges, so `red: {arch: {cell: lstm}}` is
    enough to give the two teams different cells.

    Read the result off the same two curves the ablation harness uses, not
    the zero-sum training return, which is the sum of two moving parts:
      * team.blue.reward_asf        -- the collapse channel, per update
      * eval.checkpoint_scripted_reds.*.blue.worst_reward -- fixed opponents,
        so it moves only when Blue moves

    Costs relative to a feedforward arm: 773k Blue parameters against
    `shared`'s 182k and 1.12M Red against 531k (an LSTM carries `(c, h)` and
    runs four gate matmuls per step to a GRU's three), a longer first compile
    (the PPO update backpropagates through a 500-step scan), and higher
    gradient variance per minibatch -- see the `jax` block.

algorithm: ippo

mlflow:
  checkpoint_eval:
    every_steps: 0
    episodes_per_seed: 3
    seed: null
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true

# obs -> [Dense(256) + tanh] -> GRU(256) -> {actor, critic} x [Dense(256) +
# tanh -> head]. This is JaxMARL's recurrent IPPO baseline
# (baselines/IPPO/ippo_rnn_smax.py at the pinned revision 545d8f9), copied
# rather than imported because that tree is not part of the installed jaxmarl
# distribution. JaxMARL's recurrent baselines are GRU-only; `cell: lstm` is
# this repo's addition. `hidden_layers` counts the dense layers *before* the
# recurrent cell, so 1 here is a comparable depth to `shared`'s 2-layer trunk.
# `cell: lstm` is the one field that differs from `cotraining_rnn`.
arch:
  name: recurrent
  hidden_dim: 256
  hidden_layers: 1
  activation: tanh
  cell: lstm         # gru | lstm
  # `separate` gives actor and critic their own encoder and hidden state --
  # the recurrent analogue of `arch.name: separate`, and worth an arm on its
  # own: Blue's value term runs ~8x its actor term, and a shared trunk lets
  # that gradient rewrite the features the policy reads.
  trunk: shared      # shared | separate

train:
  teams: both
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  # Both effects in the post-mortem are finished by ~5M steps, so arms run at
  # 5M rather than 40M. Matches `cotraining_test_rule_change`.
  total_timesteps: 5000000
  variant: cc4_stock

  # Same five training topologies as `cotraining`, so an arm is comparable to
  # that run's first 5M steps.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 5
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  topology_generation:
    generator: jax
    seed_start: 100
    count: 10
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # Built-in history suites also run AFTER training, before after_training.
  # They scan periodic checkpoints, which may precede the exported final model.
  # The instrument the post-mortem says would have caught the regression.
  # Fixed opponents, so the curve moves only when Blue does. Headline readout.
  checkpoint_scripted_reds:
    enabled: true
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1009
    episodes_per_seed: 1
    max_checkpoints: 6
    required: false

  cross_play:
    enabled: true
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 6
    required: false

  # Exact final-model checks, following the built-in history suites above.
  after_training:
    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1
        - --progress

# The CybORG/CleanRL backend cannot train `arch.name: recurrent` -- it
# shuffles transitions across the time axis. This block only keeps the
# projection well-formed for the recipe smoke tests; do not launch it.
cleanrl:
  num_envs: 48
  rollout_length: 500
  num_rollouts_per_update: 1
  num_minibatches: 16

jax:
  num_envs: 48
  # A recurrent minibatch is whole trajectories, not shuffled rows: the
  # divisor applies to env x agent (48*5=240 Blue, 48*6=288 Red), not to the
  # 24,000-row rollout. At 16 that is 15 Blue sequences per gradient step --
  # the same 7,500 transitions the feedforward recipes see, but correlated
  # within 15 episodes instead of drawn i.i.d. from 240. 8 halves that
  # variance (30 sequences, 15,000 transitions) at the cost of 32 gradient
  # steps per update instead of 64. Raise it back to 16 for a strictly
  # matched-update comparison against `cotraining_test_rule_change`.
  num_minibatches: 8
  update_epochs: 4
  checkpoint_every_updates: 20  # 480k-step stride -> 11 durable checkpoints over 5M.
