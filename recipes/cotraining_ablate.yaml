meta:
  name: cotraining_ablate
  source: "5M co-training ablation harness for the BlockTraffic/ASF collapse"
  added: 2026-09-09
  notes: |
    Short-budget rig for the two rule knobs added alongside
    docs/cotraining_collapse.md. Both effects in that post-mortem are finished
    by ~5M steps, so this runs at 5M instead of 40M -- an 8x faster loop.

    Arms are one edit to train.variant_overrides:

      control      {}                                         (stock CC4)
      red-damage   {red_reward: damage}
      mission-safe {blue_block_policy: mission_safe}
      both         {red_reward: damage, blue_block_policy: mission_safe}

    Read the result off two curves, not the training return (which is the
    zero-sum sum of two moving parts):
      * team.blue.reward_asf        -- the collapse channel, per update
      * eval.checkpoint_scripted_reds.*.blue.worst_reward -- a fixed opponent,
        so it moves only when Blue moves

    mission_safe narrows Blue's action space, so its scripted-Red numbers are
    NOT comparable to stock-CC4 benchmark results. Only the control arm is.

algorithm: ippo

mlflow:
  checkpoint_eval:
    every_steps: 0
    episodes_per_seed: 3
    seed: null
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  total_timesteps: 5000000
  variant: cc4_stock

  # Opt-in co-training rule knobs. Empty (or absent) reproduces stock CC4
  # exactly; see GameVariant for what each value changes.
  variant_overrides:
    red_reward: damage
    blue_block_policy: mission_safe

  # Same five training topologies as `cotraining`, so an arm is comparable to
  # that run's first 5M steps.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 5
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  topology_generation:
    generator: jax
    seed_start: 100
    count: 10
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # The instrument the post-mortem says would have caught the regression, and
  # which the 20M/40M runs had switched off. Fixed opponents, so the curve
  # moves only when Blue does. This is the headline readout for an arm.
  checkpoint_scripted_reds:
    enabled: true
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1009
    episodes_per_seed: 1
    max_checkpoints: 6
    required: false

  cross_play:
    enabled: true
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 6
    required: false

  after_training:
    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1
        - --progress

# Without this, the CleanRL projection derives num_rollouts_per_update from
# train.buffer_size (214 rollouts), which at a 5M budget is fewer than one
# update. The JAX backend is the one this recipe is for; this keeps the
# CybORG-backed projection well-formed at the short budget.
cleanrl:
  num_envs: 48
  rollout_length: 500
  num_rollouts_per_update: 1
  num_minibatches: 16

jax:
  num_envs: 48
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 20  # 480k-step stride -> 11 durable checkpoints over 5M.
