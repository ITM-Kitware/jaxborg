meta:
  name: cotraining_mappo_joint_obs
  source: "Blue MAPPO (joint-observation critic) / Red IPPO cotraining, adapted from JaxMARL"
  added: 2026-09-11
  notes: |
    cotraining_mappo counterpart whose centralized Blue critic reads only the
    five pooled Blue observations (joint_observations, 1055 features) instead
    of the privileged simulator fields in global_state (4114 features). The
    critic therefore sees exactly what the Blue team collectively observes,
    so a gain over the IPPO control is attributable to centralized credit
    assignment rather than to ground-truth compromise state. The smaller
    critic tensor (0.47 GiB per rollout vs 1.84 GiB) also cuts update cost.
    Red keeps the baseline feedforward IPPO policy. Action rules, observations
    available to actors, and the zero-sum payoff remain stock CC4. See
    docs/mappo.md for provenance and input layout.
    Start with --total-timesteps 5000000 for an ablation; the default budget,
    topology bank and evaluation protocol match cotraining.

algorithm: mappo

# During-training evaluation is disabled. Reward and CIA are measured after
# training by the enabled built-in suites and explicit eval.after_training list.
mlflow:
  checkpoint_eval:
    every_steps: 0
    episodes_per_seed: 3
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true
  # Constant learning rate; assess progress against fixed scripted Reds.

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  team_overrides:
    blue:
      arch:
        name: mappo
        hidden_dim: 256
        hidden_layers: 2
        activation: tanh
        # 1055 training-only features: five concatenated 210-element Blue
        # observations plus a five-element agent identity. No simulator
        # fields hidden from Blue enter the critic; the actor still receives 210.
        critic_input: joint_observations
      core:
        # JaxMARL MAPPO uses a clipped value objective.
        clip_value_loss: true
    red:
      arch:
        name: shared
        hidden_dim: 256
        hidden_layers: 2
        activation: tanh
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  # Match the original IPPO control's budget. MAPPO convergence has not yet
  # been measured; compare held-out performance across checkpoints.
  total_timesteps: 70000000
  variant: cc4_stock

  # One fixed training topology; num_envs controls rollout parallelism.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 1
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  # Shared by checkpoint and final suites: held-out topology seeds 100-109.
  # Development budget; use count: 50 and cross_play.max_checkpoints: 6 for final comparisons.
  topology_generation:
    generator: jax
    seed_start: 100
    count: 10
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # One final Blue vs the next training seed's final Red (cyclic seed order).
  # The multi-seed launcher supplies the opponent after all training finishes.
  # Three seeds -> three matchups; reward and CIA use the held-out bank above.
  cross_seed_play:
    enabled: true
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false

  # Built-in post-training history suites, scheduled before after_training.
  # play_priors is a cheaper alternative to cross_play. With the identical
  # settings below, its 4 adjacent matchups are already in the 9-cell matrix.
  # Leave it disabled to avoid replaying those same games in a second suite.
  play_priors:
    enabled: false
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 3

  # Every sampled historical Blue vs every sampled historical Red in this run.
  # Three checkpoints -> 9 matchups x 30 episodes (3 seeds x 10 topologies).
  # Includes adjacent pairs and self-play; reports worst_vs_history and
  # forgetting_rate. Unlike cross_seed_play, this measures change over time.
  cross_play:
    enabled: true
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 3
    required: false

  # Disabled to save evaluation time; enabling this scores up to 20 saved Blues
  # against fixed scripted Reds. The final-model scripted sweep remains enabled.
  checkpoint_scripted_reds:
    enabled: false
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1009
    episodes_per_seed: 1
    max_checkpoints: 20
    required: false

  # Explicit final-model scripts, run after the enabled built-in suites above.
  # The learned matchup selects both policies from the exact final bundle.
  # The scripted sweep then selects its trained Blue
  # policy and evaluates it against FSM and CIA Red agents in the same JAX
  # topology bank with fixed per-topology role assignments.
  after_training:
    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null  # eval_matchup accepts separate Blue/Red model flags.
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1
        # One line per vmapped batch. Without it a Red in flight prints
        # nothing until it finishes, so a slow sweep looks hung.
        - --progress

jax:
  num_envs: 96  # Start here on a 40 GB GPU; benchmark 48/96 before trying 192.
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 20  # Save every 960,000 environment steps.
