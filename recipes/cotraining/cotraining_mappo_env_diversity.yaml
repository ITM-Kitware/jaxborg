meta:
  name: cotraining_mappo_env_diversity
  source: "Blue MAPPO / Red MAPPO cotraining, adapted from JaxMARL"
  added: 2026-09-10
  notes: |
    Both teams use local actors and centralized global_state critics: Blue
    has 4114 critic features and Red has 7301, including agent identity.
    Each critic pools its team's policy observations and adds the same
    selected simulator features. Action rules, observations available to
    actors, and the zero-sum payoff remain stock CC4. JaxMARL's MAPPO data
    flow is adapted to the joint trainer. See docs/mappo.md for details.
    Start with --total-timesteps 5000000 for an ablation; the default budget,
    topology bank and evaluation protocol match cotraining_env_diversity.

algorithm: mappo
cage4_enhanced_obs: true

# During-training evaluation is disabled. Reward and CIA are measured after
# training by the enabled built-in suites and explicit eval.after_training list.
mlflow:
  checkpoint_eval:
    every_steps: 0
    episodes_per_seed: 6
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true
  # Constant learning rate; assess progress against fixed scripted Reds.

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  team_overrides:
    blue:
      arch:
        name: mappo
        hidden_dim: 256
        hidden_layers: 2
        activation: tanh
        # 4114 training-only features; the actor still receives 210.
        # joint_observations (1055) pools Blue views without hidden host health.
        critic_input: global_state
      core:
        # JaxMARL MAPPO uses a clipped value objective.
        clip_value_loss: true
    red:
      arch:
        name: mappo
        team: red
        hidden_dim: 256
        hidden_layers: 2
        activation: tanh
        # 7301 training-only features; the actor still receives 706.
        critic_input: global_state
      core:
        clip_value_loss: true
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  # Match the original IPPO control's budget. MAPPO convergence has not yet
  # been measured; compare held-out performance across checkpoints.
  total_timesteps: 50000000
  variant: cc4_stock

  # Seed 0 is shared with the control; seeds 1-99 add topology diversity.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 100
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  # Shared by checkpoint and final suites: held-out topology seeds 100-109.
  # Development budget; use count: 50 and cross_play.max_checkpoints: 6 for final comparisons.
  topology_generation:
    generator: jax
    seed_start: 100
    count: 10
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # One final Blue vs the next training seed's final Red (cyclic seed order).
  # The multi-seed launcher supplies the opponent after all training finishes.
  # Three seeds -> three matchups; reward and CIA use the held-out bank above.
  cross_seed_play:
    enabled: true
    seeds: 1000-1009
    episodes_per_seed: 6
    deterministic: false

  # Multi-seed launcher: compare both Blue conditions against both Red pools.
  # Excludes same-training-seed opponents; runs once after all seeds finish.
  env_diversity:
    enabled: true
    baseline_recipe: cotraining_mappo
    seeds: 1000-1009
    episodes_per_seed: 6
    deterministic: false

  # Built-in post-training history suites, scheduled before after_training.
  # play_priors is a cheaper alternative to cross_play. With the identical
  # settings below, its 4 adjacent matchups are already in the 9-cell matrix.
  # Leave it disabled to avoid replaying those same games in a second suite.
  play_priors:
    enabled: false
    seeds: 1000-1002
    episodes_per_seed: 6
    deterministic: false
    max_checkpoints: 3

  # First, middle and exact final bundle: every Blue vs every Red in this run.
  # Three checkpoints -> 9 matchups x 180 episodes (3 seeds x 6 episodes x 10 topologies).
  # Includes adjacent pairs and self-play; reports worst_vs_history and
  # forgetting_rate. Unlike cross_seed_play, this measures change over time.
  cross_play:
    enabled: true
    seeds: 1000-1002
    episodes_per_seed: 6
    deterministic: false
    max_checkpoints: 3
    include_final: true  # Final Blue is evaluated against the sampled prior Reds.
    required: true

  # Blue's curve against fixed FSM and CIA Reds, run on the evaluation GPU.
  # Every 4.8M steps (each fifth 960k checkpoint) plus the exact final bundle:
  # 11 points at 50M, each 4 Reds x 180 episodes (3 seeds x 6 episodes x 10 topologies).
  # The final-model scripted-reds sweep below remains the 600-episode result.
  checkpoint_scripted_reds:
    enabled: true
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1002
    episodes_per_seed: 6
    every_steps: 4800000
    include_final: true
    required: true

  # Explicit final-model scripts, run after the enabled built-in suites above.
  after_training:
    - name: cage4-benchmark
      script: scripts/eval/eval_scripted_reds.py
      jax_platforms: cpu
      args:
        - --eval-name
        - cage4-benchmark
        - --reds
        - fsm
        - --seeds
        - 1000-1099
        - --episodes-per-seed
        - 6
        - --workers
        - 4

    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null  # eval_matchup accepts separate Blue/Red model flags.
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 6
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 6
        # One line per vmapped batch. Without it a Red in flight prints
        # nothing until it finishes, so a slow sweep looks hung.
        - --progress

    # H-MARL Aggressive, Stealthy and Impact; Default/FSM is in scripted-reds.
    - name: hmarl-reds
      script: scripts/eval/eval_hmarl_reds.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - aggressive
        - stealthy
        - impact
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 6
        - --progress

    # Same-seed non-diverse Red; supplied after both conditions finish training.
    # Other seeds from both Red conditions are covered by eval.env_diversity.
    - name: nondiverse-red
      script: scripts/eval/eval_matchup.py
      model_arg: --blue-path
      args: [--recipe, "{recipe}", --policy-backend, "{backend}",
             --red-path, "{nondiverse_red}", --name, nondiverse-red,
             --seeds, 1000-1009, --episodes-per-seed, 6]

jax:
  num_envs: 96  # Both centralized critics add memory; use --num-envs 48 for a smaller pilot.
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 20  # Save every 960,000 environment steps.
