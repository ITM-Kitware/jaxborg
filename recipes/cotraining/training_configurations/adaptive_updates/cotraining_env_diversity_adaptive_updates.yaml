meta:
  name: cotraining_env_diversity_adaptive_updates
  source: "Dual-team simultaneous self-play with topology diversity"
  added: 2026-09-06
  notes: |
    Schedule adapted from arXiv:2511.17879, section 3.3 / Algorithm 1;
    the 100-rollout forced update is an additional experiment setting.
    Two-phase adaptive-update copy of cotraining_env_diversity (2026-10-07).
    Blue learns every rollout; Red learns every fourth rollout for the first
    200 Blue updates (50 Red updates), then follows the raw Blue return gate.
    Recalibrated 2026-10-08 from the archived seed-42 adaptive run; see README.md
    for the threshold rationale and limitations.
    Blue uses LR 1e-4, Red retains LR 3e-4; the closed-gate timeout is 100 rollouts.
    This update schedule requires the JAX backend.
    Topology-diversity counterpart to cotraining. Both parameter-sharing
    policies start from fresh weights and train on a fixed bank of 100
    generated topologies. Other recipe-controlled environment-diversity axes
    remain disabled. Evaluation uses the same held-out bank as cotraining.

algorithm: ippo
cage4_enhanced_obs: true

# Saved-checkpoint reward/CIA learning curves are evaluated after training by
# eval.checkpoint_scripted_reds; live in-training evaluation remains disabled.
mlflow:
  checkpoint_eval:
    every_steps: 0
    episodes_per_seed: 1
    seed: null  # Defaults to the training seed + 100000.
    deterministic: false

core:
  lr: 3.0e-4  # Red's LR; Blue uses train.team_overrides.blue.core.lr.
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.01
  norm_rewards: true
  # Constant learning rate; assess progress against fixed scripted Reds.

arch:
  name: shared
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh

train:
  teams: both
  team_overrides:
    blue:
      core:
        lr: 1.0e-4  # Smaller Blue optimizer steps; a stability hypothesis.
  # Phase 1: 200 Blue PPO updates (9.6M env steps) and 50 Red PPO updates.
  update_every: {blue: 1, red: 4}
  adaptive_updates:
    phase_switch_blue_updates: 200  # Phase 2 starts on Blue update 201.
    reward_threshold: -2550.0     # Near the archived 20-rollout phase-2 upper quartile (-2536).
    window_blue_updates: 20       # Current rollout and the previous 19; raw Blue returns.
    max_frozen_blue_rollouts: 100  # Force one Red update after 4.8M closed-gate env steps.
  # Phase 2: Red updates every rollout while open, otherwise skips PPO.
  # Every Red update resets the frozen counter; skipped data is discarded.
  episode_length: 500
  buffer_size: 5120000
  minibatch_size: 320000
  sgd_iterations: 64
  total_timesteps: 50000000
  variant: cc4_stock

  # Seed 0 is shared with the control; seeds 1-99 add topology diversity.
  topology_generation:
    generator: jax
    seed_start: 0
    count: 100
    cache_dir: .bank_cache/topologies/cotraining/train

eval:
  variant: cia_resilience

  cia:
    enabled: true
    metric: resilience
    role_assignment: fixed_per_topology

  # Shared by checkpoint and final suites: held-out topology seeds 100-109.
  # Development budget; use count: 50 and cross_play.max_checkpoints: 6 for final comparisons.
  topology_generation:
    generator: jax
    seed_start: 100
    count: 10
    op_zone_servers: 3
    cache_dir: .bank_cache/topologies/cotraining/eval_ops3
  topology_sampling: exhaustive

  # One final Blue vs the next training seed's final Red (cyclic seed order).
  # The multi-seed launcher supplies the opponent after all training finishes.
  # Three seeds -> three matchups; reward and CIA use the held-out bank above.
  cross_seed_play:
    enabled: false
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false

  # Multi-seed launcher: compare both Blue conditions against both Red pools.
  # Excludes same-training-seed opponents; runs once after all seeds finish.
  env_diversity:
    enabled: true
    baseline_recipe: cotraining_adaptive_updates
    seeds: 1000-1009
    episodes_per_seed: 1
    deterministic: false

  # Built-in post-training history suites, scheduled before after_training.
  # play_priors is a cheaper alternative to cross_play. With the identical
  # settings below, its 4 adjacent matchups are already in the 9-cell matrix.
  # Leave it disabled to avoid replaying those same games in a second suite.
  play_priors:
    enabled: false
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 3

  # Every sampled historical Blue vs every sampled historical Red in this run.
  # Three checkpoints -> 9 matchups x 30 episodes (3 seeds x 1 episode x 10 topologies).
  # Includes adjacent pairs and self-play; reports worst_vs_history and
  # forgetting_rate. Unlike cross_seed_play, this measures change over time.
  cross_play:
    enabled: true
    seeds: 1000-1002
    episodes_per_seed: 1
    deterministic: false
    max_checkpoints: 3
    required: false

  # After training, score up to 20 saved Blues against fixed FSM/CIA Reds to
  # produce reward and C/I/A learning curves at the saved training steps.
  checkpoint_scripted_reds:
    enabled: true
    reds: [fsm, cia_c, cia_i, cia_a]
    seeds: 1000-1009
    episodes_per_seed: 3
    max_checkpoints: 20
    required: false

  # Explicit final-model scripts, run after the enabled built-in suites above.
  # The learned matchup selects both policies from the exact final bundle.
  # The scripted sweep then selects its trained Blue
  # policy and evaluates it against FSM and CIA Red agents in the same JAX
  # topology bank with fixed per-topology role assignments.
  after_training:
    - name: cage4-benchmark
      script: scripts/eval/eval_scripted_reds.py
      jax_platforms: cpu
      args:
        - --eval-name
        - cage4-benchmark
        - --reds
        - fsm
        - --seeds
        - 1000-1099
        - --episodes-per-seed
        - 1
        - --workers
        - 4

    - name: learned-red-ppo
      script: scripts/eval/eval_matchup.py
      model_arg: null  # eval_matchup accepts separate Blue/Red model flags.
      args:
        - --recipe
        - "{recipe}"
        - --policy-backend
        - "{backend}"
        - --blue-path
        - "{model}"
        - --red-path
        - "{model}"
        - --episodes-per-seed
        - 1
        - --seeds
        - 1000-1009

    - name: scripted-reds
      script: scripts/eval/eval_scripted_reds_jax.py
      args:
        - --recipe
        - "{recipe}"
        - --reds
        - fsm
        - cia_c
        - cia_i
        - cia_a
        - --seeds
        - 1000-1009
        - --episodes-per-seed
        - 1
        # One line per vmapped batch. Without it a Red in flight prints
        # nothing until it finishes, so a slow sweep looks hung.
        - --progress

jax:
  num_envs: 96  # Start here on a 40 GB GPU; benchmark 48/96 before trying 192.
  num_minibatches: 16
  update_epochs: 4
  checkpoint_every_updates: 20  # Save every 960,000 environment steps.
